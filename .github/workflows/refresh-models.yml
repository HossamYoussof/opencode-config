name: Refresh Models

# Re-picks the best-fit free models for every agent role in both the
# `opencode` and `nvidia` presets of oh-my-opencode-slim.json, then opens an
# auto-merged PR. The model lineup rotates faster than a human can track, so
# this runs weekly.
#
# Both pickers are fully deterministic — no API key, no LLM call. The opencode
# picker scores models from https://models.dev/api.json against a per-role
# weight profile; the NVIDIA picker scores models from the NVIDIA NIM catalog
# at https://integrate.api.nvidia.com/v1/models.

on:
  schedule:
    # 04:17 UTC every Monday. Deliberately off the hour — the
    # top-of-hour slot is heavily oversubscribed and starts late.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only — do not open or auto-merge a PR'
        type: boolean
        default: false

permissions:
  contents: write # push the PR branch
  pull-requests: write # set auto-merge on the opened PR

concurrency:
  group: refresh-models
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the PR branch may survive from a previous run, and
          # create-pull-request needs the ancestry to update it. The repo is
          # four files, so this costs nothing.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Script needs Node >= 20 (global fetch + node:test). 24 is the
          # current LTS and matches the node24 runtime the actions themselves run on.
          node-version: '24'

      - name: Test the picker
        run: node --test scripts/refresh-opencode/refresh-opencode-models.test.mjs

      - name: Test the NVIDIA picker
        run: node --test scripts/refresh-nvidia/refresh-nvidia-models.test.mjs

      - name: Pick opencode models and write the report
        id: pick
        run: |
          node scripts/refresh-opencode/refresh-opencode-models.mjs \
            --config oh-my-opencode-slim.json \
            --roles scripts/refresh-opencode/opencode-model-roles.json \
            --report pr-body.md

      - name: Pick NVIDIA models and write the report
        id: pick-nvidia
        continue-on-error: true
        run: |
          node scripts/refresh-nvidia/refresh-nvidia-models.mjs \
            --config oh-my-opencode-slim.json \
            --roles scripts/refresh-nvidia/nvidia-model-roles.json \
            --report nvidia-report.md
        env:
          # Required secret: NVIDIA_API_KEY (set in repo settings -> Secrets and variables -> Actions).
          # Without it, the NVIDIA catalog fetch is unauthenticated and returns 401/403.
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-picker-reports
          path: |
            pr-body.md
            nvidia-report.md

      - name: Combine reports for PR body
        if: inputs.dry_run != true
        run: |
          {
            cat pr-body.md
            echo ''
            echo '## NVIDIA Model Refresh'
            echo ''
            cat nvidia-report.md 2>/dev/null || echo '*NVIDIA report unavailable — NVIDIA picker skipped or failed*'
          } > pr-body-combined.md

      - name: Open pull request
        id: cpr
        if: inputs.dry_run != true
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: oh-my-opencode-slim.json
          branch: chore/refresh-opencode-models
          commit-message: 'chore(preset): refresh opencode model assignments'
          title: 'chore(preset): refresh opencode model assignments'
          body-path: pr-body-combined.md
          labels: automated

      - name: Enable auto-merge
        # pull-request-operation is empty when the picker made no change, in
        # which case no PR exists and there is nothing to merge. That is the
        # normal weekly outcome whenever the lineup has not shifted.
        if: steps.cpr.outputs.pull-request-operation != '' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          if gh pr merge --auto --merge "$PR_NUMBER"; then
            echo "Auto-merge enabled on PR #$PR_NUMBER."
          else
            echo "::warning::Could not enable auto-merge on PR #$PR_NUMBER. Merge it manually. If this keeps failing, enable Settings -> General -> Pull Requests -> 'Allow auto-merge'."
          fi
